
container:
  # optional, clash image, default to docker.io/metacubex/mihomo:latest
  image: docker.io/metacubex/mihomo:latest
  # optional, container command, default to podman
  command: podman
  # optional, working dir inside container, default to /root/.config/mihomo/
  workdir: /root/.config/mihomo/

instance:
  # required, your name under `container / name / {NAME}`
  name: clash
  # required, your subscription url
  subscription: https://rst.im/clash/
  # required, path to clash config/working directory
  clash_root: /config/clash/work

# processed after downloaded files and before local configs
providers:
- provider-type: proxy-providers
  # name of proxy provider
  name: test-provider
  # type of proxy provider, http, file, etc.
  type: http
  # Proxy Provider URL
  url: https://rst.im/clash/proxy-provider
  # local path to proxy provider config
  path: ./profiles/proxy_providers/test-provider.yaml
  # optional, use override (supported by mihomo) to set dialer-proxy
  #override:
  #  dialer-proxy: PROXY
  # Create a new proxy group (single format, backward compatible)
  # You can also use list format to create multiple proxy groups:
  # create-proxy-group:
  #   - name: TEST-PROXY-1
  #     type: select
  #   - name: TEST-PROXY-2
  #     type: url-test
  #     url: 'https://www.gstatic.com/generate_204'
  #     interval: 300
  create-proxy-group:
    name: TEST-PROXY
    type: select
  # Add this provider's proxy nodes to these groups (their use field)
  add-proxies-to-proxy-group:
  - UNMATCHED-PROXY
  # deprecated: add created group(s) to these groups' proxies; use add-to-proxy-group instead
  add-provider-to-proxy-group:
  - DEFAULT-PROXY
  - 🇭🇰 HK-RG-AUTO
  # you can add all extra fields supported by proxy-providers

# Example: Multiple proxy groups + add-to-proxy-group (runs after all providers, cross-ref ok)
